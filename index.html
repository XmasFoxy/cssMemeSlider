<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Slider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>The best memes of all the time!</h1>
  <input id="point1" type="radio" name="meme" checked>
  <input id="point2" type="radio" name="meme">
  <input id="point3" type="radio" name="meme">
  <input id="point4" type="radio" name="meme">
  <div class="flex-container">
    <div class="img-content first">
      <div class="img-container move1">
        <img src="img/doggy.jpg" id="doggy" alt="a planet with a funny dog's face">
        <p>"Star Wars" for pet-lovers!</p>
      </div>
    </div>
    <div class="img-content second">
      <div class="img-container move2">
        <img src="img/mustache.jpg" id="mustache" alt="a man who knows something">
        <p>When anybody says AI will replace programmers</p>
      </div>
    </div>
    <div class="img-content third">
      <div class="img-container move3">
        <img src="img/Shrek.png" id="doggy" alt="Default windows 7 wallpaper with Shrek">
        <p>They asked me about the benefits of Windows 7. I showed them this picture!</p>
      </div>
    </div>
    <div class="img-content fourth">
      <div class="img-container move4">
        <img src="img/universe.jpg" id="doggy" alt="a crazy universe">
        <p>What happens in my head when I try to focus...</p>
      </div>
    </div>
  </div>

</body>

</html>

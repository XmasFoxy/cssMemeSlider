<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Slider</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>The best memes of all the time!</h1>
  <div class="flex-container">
    <div class="content-container" id="first">
      <figure class="img-container">
        <img src="img/doggy.jpg" id="doggy" alt="a planet with a funny dog's face">
        <figcaption>"Star Wars" for pet-lovers!</figcaption>
      </figure>
    </div>
    <div class="content-container" id="second">
      <figure class="img-container">
        <img src="img/mustache.jpg" id="mustache" alt="a man who knows something">
        <figcaption>When anybody says AI will replace programmers</figcaption>
      </figure>
    </div>
    <div class="content-container" id="third">
      <figure class="img-container">
        <img src="img/Shrek.png" id="doggy" alt="Default windows 7 wallpaper with Shrek">
        <figcaption>They asked me about the benefits of Windows 7. I've showed them this picture!</figcaption>
      </figure>
    </div>
    <div class="content-container" id="fourth">
      <figure class="img-container">
        <img src="img/universe.jpg" id="doggy" alt="a crazy universe">
        <figcaption>What happens on my head when I try to focus...</figcaption>
      </figure>
    </div>

    <div class="radio-container">
      <label for="slide1">
        <input type="radio" name="slider" id="slide1" checked>
      </label>
      <label for="slide2">
        <input type="radio" name="slider" id="slide2">
      </label>
      <label for="slide3">
        <input type="radio" name="slider" id="slide3">
      </label>
      <label for="slide4">
        <input type="radio" name="slider" id="slide4">
      </label>
    </div>
</body>

</html>
